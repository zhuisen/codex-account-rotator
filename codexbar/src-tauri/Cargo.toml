[package]
name = "codexbar"
version = "0.11.1"
description = "Codex account rotator — Clash-Verge-style menu bar + dashboard"
authors = ["doushutangmu"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tokio = { version = "1", features = ["time"] }
tauri-plugin-window-state = "2"
libc = "0.2.189"

# ★ 给菜单栏标题**按阈值上色**。Tauri 的 `set_title` 只收纯 str;macOS 要给状态栏文字上色必须走
#   `NSStatusItem.button.attributedTitle` —— 而 Tauri 2.11 的 `TrayIcon.inner` 是私有字段、
#   无 Deref、无访问器(已核 tauri/src/tray/mod.rs:398),tray-icon 虽有 `ns_status_item()` 也够不到。
#   所以用 objc2 在**本进程**的 NSApp.windows 里找到 NSStatusBarButton 自己设。
#   版本对齐依赖树里已有的(objc2 0.6 / app-kit 0.3 / foundation 0.3),避免同一套绑定引入两份。
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
